name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Frontend
        run: npm run build

      - name: 📁 Prepare Deployment Directory
        run: |
          mkdir -p deploy_pkg
          cp -r dist/* deploy_pkg/
          cp -r api deploy_pkg/
          cp schema.sql deploy_pkg/
          cp .htaccess deploy_pkg/ 2>/dev/null || true
          [ -d images ] && cp -r images deploy_pkg/ || true

      - name: 🚀 Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_SERVER_DIR || 'public_html/' }}
          local-dir: ./deploy_pkg/
